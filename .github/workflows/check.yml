# Runs the repository self-test and the table/provenance consistency check on
# every push. CPU only, no training: test_repo.py plays a few short games and
# make_tables.py --check only reads results/ and hashes the raw files.
name: check

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-fast.txt

      # slimevolleygym imports OpenCV, which needs the system GL library
      - name: System libraries
        run: sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends libgl1

      - name: Install pinned requirements
        run: pip install -r requirements.txt -r requirements-fast.txt

      - name: Repository self-test
        run: python -W ignore test_repo.py

      - name: Every table follows from the raw data
        run: python make_tables.py --check
